name: ClaudeManager
options:
  bundleIdPrefix: ai.semenov
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

# DEVELOPMENT_TEAM lives here (gitignored); copy from Local.xcconfig.example.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ClaudeManager:
    type: application
    platform: iOS
    sources:
      - path: ClaudeManager
      - path: Shared
        excludes:
          - "*.example"
    dependencies:
      - target: SessionsWidget
    info:
      path: ClaudeManager/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: ai.semenov.hangar
            CFBundleURLSchemes: [hangar]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.semenov.hangar
        PRODUCT_NAME: Hangar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hangar
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the code `hangar pair` shows on your Mac.
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

  SessionsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
        excludes:
          - "*.example"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Hangar
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.semenov.hangar.widget
        PRODUCT_NAME: SessionsWidget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
